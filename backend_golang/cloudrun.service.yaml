apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: instaweb-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/instaweb-api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: "https://YOUR_FRONTEND_DOMAIN"
            - name: AUTO_MIGRATE
              value: "true"
            - name: SEED_DEMO_DATA
              value: "true"
            - name: SUPABASE_STORAGE_BUCKET
              value: "instaweb-uploads"
            - name: DATABASE_MAX_OPEN_CONNS
              value: "4"
            - name: DATABASE_MAX_IDLE_CONNS
              value: "2"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: instaweb-database-url
                  key: latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: instaweb-jwt-secret
                  key: latest
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: instaweb-supabase-url
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: instaweb-supabase-service-role-key
                  key: latest
            - name: MIDTRANS_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: instaweb-midtrans-server-key
                  key: latest
